name: probe public ports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve
        run: |
          getent hosts rustdesk.supeduonline.com || true
          curl -sS -m 15 -o /dev/null -w 'https_status=%{http_code}\n' https://rustdesk.supeduonline.com/ || echo "curl https failed"
          curl -sS -m 15 -o /dev/null -w 'api_https_status=%{http_code}\n' https://rustdesk.supeduonline.com/api/login || echo "curl api failed"

      - name: TCP probe
        run: |
          for p in 443 21114 21115 21116 21117 21118 11430 11431 11432; do
            if timeout 8 nc -z 39.170.9.195 $p; then
              echo "TCP $p OPEN"
            else
              echo "TCP $p CLOSED"
            fi
          done
