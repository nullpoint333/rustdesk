name: probe public ports

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and probe
        run: |
          set -x
          getent hosts rustdesk.supeduonline.com || true
          for p in 443 21116 21117 21118 21114; do
            if timeout 8 nc -z 39.170.9.195 $p; then
              echo "TCP $p OPEN"
            else
              echo "TCP $p CLOSED"
            fi
          done
          timeout 8 nc -vzu 39.170.9.195 21116 || true
